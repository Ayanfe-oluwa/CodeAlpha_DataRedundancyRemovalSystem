services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redundancy
      POSTGRES_USER: redundancy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redundancy_user -d redundancy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://redundancy_user:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/redundancy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
